# Sentinella del database, DA FUORI.
#
# Perché esiste (08/10/2026): alle 11:47 il database ha smesso di accettare connessioni e nessuno è stato avvisato.
# La sonda interna (battito_esterno) gira DENTRO il database con pg_cron: quando il database si blocca si ferma anche
# lei, e non può avvisare. Questa gira su GitHub, ogni 5 minuti, e misura:
#   1. battito_ping attraverso l'API pubblica PostgREST usata dall'app;
#   2. una query minima («select 1») dal percorso Management API, separatamente.
# Una risposta sana richiede un solo giro; gli errori dell'API pubblica sono
# confermati con al massimo tre prove. Un guasto amministrativo da solo non
# viene presentato come app indisponibile. Nessun riavvio automatico.
# Se il database non risponde (o risponde troppo piano) il controllo FALLISCE: GitHub manda una email (e una notifica
# sull'app GitHub) a chi ha attivato le notifiche delle Actions per questo repository.
#
# Prova: Actions → «Sentinella database» → Run workflow → prova = true. Deve fallire e farti arrivare l'avviso.
name: Sentinella database

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      prova:
        description: "Fai fallire il controllo apposta, per verificare che l'avviso arrivi"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sentinella-database
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Controlla database e API pubblica
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          REF: rsbrguhkodgnqfomrevo
          PROVA: ${{ inputs.prova }}
          SOGLIA_LENTO_MS: "8000"
        run: node scripts/sentinella-database.mjs
      # Memoria del server (17/10/2026): il 15/10 RAM e swap si sono riempiti e il server si è riavviato da solo.
      # Avvisa quando la memoria resta alta per un minuto, PRIMA del blocco. Soglie in scripts/sentinella-memoria.mjs.
      - name: Controlla la memoria del server
        if: always()
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: rsbrguhkodgnqfomrevo
          PROVA: ${{ inputs.prova }}
        run: node scripts/sentinella-memoria.mjs
