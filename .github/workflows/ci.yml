name: CI / Edge-function deploy

# ── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    # Verification tags run the complete checks without creating hosted database
    # branches. The deployment job remains restricted to refs/heads/main.
    tags: [verify-automation-completion-*]
  pull_request:
    branches: [main]
  # Avvio a mano. Serve quando il deploy non e' partito da solo: se il job
  # viene saltato — per esempio perche' il typecheck era rosso — le funzioni di
  # quel push non escono PIU', perche' il passo qui sotto diffa il range del
  # push e quei commit restano nel passato. Successo il 7 settembre 2026: 18
  # funzioni ferme fino a otto ore, fra cui la correzione sugli inviti.
  workflow_dispatch:
    inputs:
      funzioni:
        description: >-
          Quali funzioni ripubblicare, separate da spazio
          (es. "invia-sms create-reseller"). Vuoto = tutte.
        required: false
        type: string

# Una nuova revisione della stessa PR sostituisce le verifiche precedenti.
# I deploy su main, invece, non vengono interrotti.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ── Shared env ───────────────────────────────────────────────────────────────
env:
  SUPABASE_PROJECT_ID: rsbrguhkodgnqfomrevo

jobs:
  migration-history:
    name: Complete offline database reconstruction
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Replay every migration with network and cron disabled
        run: python3 scripts/test-migration-history.py

  frontend-build:
    name: Frontend production build
    # Official image matches the lockfile and already contains browser libraries.
    # This avoids APT mirror/DNS failures before the actual build can start.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --shm-size=1g
    env:
      # Identificazione pubblica del frontend, sempre soggetta a RLS. Nessuna chiave server.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://rsbrguhkodgnqfomrevo.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_DA4gwckTQ2eiYjDKvfVO4Q_sEKCmyKH' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with:
          bun-version: '1.4.4'
      - name: Install Bun from npm if GitHub download fails
        if: steps.bun.outcome == 'failure'
        run: npm install --global bun@1.4.4
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Verify bundled browser launches
        run: >-
          node --input-type=module -e
          "import { chromium } from 'playwright'; const browser = await chromium.launch({headless:true}); await browser.close();"
      - name: Build application and prerender public routes
        run: npm run build
      - name: Verify prerendered routes
        run: npm run prerender:verify
      - name: Save build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: dist
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────
  # 1. TypeScript check (frontend)
  # ─────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with:
          bun-version: '1.4.4'

      # Anche con Bun disponibile, gli asset GitHub possono rispondere 504.
      # npm distribuisce lo stesso runtime senza passare da quell'endpoint.
      - name: Install Bun from npm if GitHub download fails
        if: steps.bun.outcome == 'failure'
        run: npm install --global bun@1.4.4 && bun --version

      - name: Install deps
        run: bun install --frozen-lockfile

      # NON "bunx tsc --noEmit": quel comando usa il tsconfig di radice, che e'
      # un contenitore vuoto (files: [] + references). Senza --build TypeScript
      # non segue i rimandi e compila ZERO file: il job era verde per
      # costruzione e ha lasciato passare 1.542 errori di tipo.
      - name: Controllo tipi (con cricchetto)
        env:
          TYPECHECK_DIAGNOSTICS_FILE: typecheck-diagnostics.log
        run: bun run typecheck:ci

      - name: Save completed TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics-${{ github.sha }}
          path: typecheck-diagnostics.log
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Critical unit tests
  # ─────────────────────────────────────────────────────────────────────────
  critical-tests:
    name: Critical tests / ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [core, worksite, access, economics]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with:
