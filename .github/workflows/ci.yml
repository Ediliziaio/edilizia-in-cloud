      - name: Run catalogue and selected-company regressions
        if: matrix.group == 'economics'
        run: >-
          bunx vitest run --maxWorkers=2
          src/test/ui/materialiListino.test.tsx
          src/test/logic/preventivoCostiTariffe.test.tsx
          src/test/logic/listinoAziendaEffettiva.test.ts
          src/test/ui/staffSenzaInvioEmail.test.tsx
          src/test/ui/aggiungiArticolo.test.tsx
