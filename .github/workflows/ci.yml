name: CI / Edge-function deploy

# ── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── Shared env ───────────────────────────────────────────────────────────────
env:
  SUPABASE_PROJECT_ID: rsbrguhkodgnqfomrevo

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. TypeScript check (frontend)
  # ─────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Critical unit tests
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Critical tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run critical tests
        run: npm run test:critical

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Deploy changed edge functions (main only, after checks pass)
  # ─────────────────────────────────────────────────────────────────────────
  deploy-functions:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD~1 to diff

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Detect which function slugs changed.
      # Excludes _shared / _customer_os_shared (library dirs, not deployable).
      # Falls back to empty list if HEAD~1 doesn't exist (first commit on main).
      - name: Detect changed functions
        id: changed
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- supabase/functions/ \
              | grep '^supabase/functions/' \
              | grep -v '^supabase/functions/_' \
              | awk -F/ '{print $3}' \
              | sort -u \
              | grep -v '^$' \
              | tr '\n' ' ' \
              | xargs)  # trim trailing space
          else
            CHANGED=""
          fi
          echo "functions=${CHANGED}" >> "$GITHUB_OUTPUT"
          if [ -n "$CHANGED" ]; then
            echo "Changed functions: ${CHANGED}"
          else
            echo "No deployable functions changed."
          fi

      # Deploy each changed function via --use-api (no Docker required in CI).
      # verify_jwt is read from supabase/config.toml automatically.
      # Non-blocking: a single function failure does not abort the rest.
      - name: Deploy changed functions
        if: steps.changed.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          FAILED=()
          for fn in ${{ steps.changed.outputs.functions }}; do
            echo "──────────────────────────────────────────"
            echo "→ Deploying: ${fn}"
            if supabase functions deploy "${fn}" \
                --project-ref "${SUPABASE_PROJECT_ID}" \
                --use-api; then
              echo "✓ ${fn} — deployed"
            else
              echo "✗ ${fn} — FAILED"
              FAILED+=("${fn}")
            fi
          done

          echo "══════════════════════════════════════════"
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "Deploy failures: ${FAILED[*]}"
            exit 1
          else
            echo "All functions deployed successfully."
          fi

      - name: No functions to deploy
        if: steps.changed.outputs.functions == ''
        run: echo "No edge function changes detected — skipping deploy step."
