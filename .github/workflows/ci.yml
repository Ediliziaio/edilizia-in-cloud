name: CI / Edge-function deploy

# ── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── Shared env ───────────────────────────────────────────────────────────────
env:
  SUPABASE_PROJECT_ID: rsbrguhkodgnqfomrevo

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. TypeScript check (frontend)
  # ─────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      # NON "bunx tsc --noEmit": quel comando usa il tsconfig di radice, che e'
      # un contenitore vuoto (files: [] + references). Senza --build TypeScript
      # non segue i rimandi e compila ZERO file: il job era verde per
      # costruzione e ha lasciato passare 1.542 errori di tipo.
      - name: Controllo tipi (con cricchetto)
        run: bun run typecheck:ci

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Critical unit tests
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Critical tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run critical tests
        run: bun run test:critical

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Deploy changed edge functions (main only, after checks pass)
  # ─────────────────────────────────────────────────────────────────────────
  deploy-functions:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          # Serve l'INTERO range del push, non solo l'ultimo commit: con
          # fetch-depth 2 un push di piu' commit deployava soltanto le funzioni
          # toccate dall'ultimo. Vedi la nota nel passo "Detect changed functions".
          fetch-depth: 0

      # Versione PINNATA: `version: latest` faceva una API call anonima a GitHub
      # per risolvere l'ultima release → rate-limit (60 req/h per IP) sui runner
      # condivisi → job rosso random ("Failed to resolve latest Supabase CLI
      # release: rate limit exceeded"). Con una versione fissa non serve nessuna
      # chiamata. Il GITHUB_TOKEN autentica eventuali download (limiti più alti).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Detect which function slugs changed.
      # Excludes _shared / _customer_os_shared (library dirs, not deployable).
      #
      # Si diffa l'INTERO range del push (github.event.before → HEAD), non
      # HEAD~1: con un push di piu' commit, HEAD~1 vede solo l'ultimo e le
      # funzioni cambiate nei commit precedenti non venivano mai deployate — in
      # silenzio, con la CI verde. Successo verificato il 31/08/2026: un push di
      # 3 commit con una modifica a process-automation nel secondo ha prodotto
      # "No functions to deploy", e il fix delle notifiche lead non e' andato in
      # produzione pur risultando pubblicato.
      #
      # Fallback su HEAD~1 quando `before` non e' utilizzabile: primo commit del
      # branch (SHA di zeri) o force-push che ha reso `before` irraggiungibile.
      - name: Detect changed functions
        id: changed
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi
          echo "Diff range: ${BASE:-<nessuno>} → HEAD"
          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only "$BASE" HEAD -- supabase/functions/ \
              | grep '^supabase/functions/' \
              | grep -v '^supabase/functions/_' \
              | awk -F/ '{print $3}' \
              | sort -u \
              | grep -v '^$' \
              | tr '\n' ' ' \
              | xargs)  # trim trailing space
          else
            CHANGED=""
          fi
          echo "functions=${CHANGED}" >> "$GITHUB_OUTPUT"
          if [ -n "$CHANGED" ]; then
            echo "Changed functions: ${CHANGED}"
          else
            echo "No deployable functions changed."
          fi

      # Deploy each changed function via --use-api (no Docker required in CI).
      # verify_jwt is read from supabase/config.toml automatically.
      # Non-blocking: a single function failure does not abort the rest.
      - name: Deploy changed functions
        if: steps.changed.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          FAILED=()
          for fn in ${{ steps.changed.outputs.functions }}; do
            echo "──────────────────────────────────────────"
            echo "→ Deploying: ${fn}"
            if supabase functions deploy "${fn}" \
                --project-ref "${SUPABASE_PROJECT_ID}" \
                --use-api; then
              echo "✓ ${fn} — deployed"
            else
              echo "✗ ${fn} — FAILED"
              FAILED+=("${fn}")
            fi
          done

          echo "══════════════════════════════════════════"
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "Deploy failures: ${FAILED[*]}"
            exit 1
          else
            echo "All functions deployed successfully."
          fi

      - name: No functions to deploy
        if: steps.changed.outputs.functions == ''
        run: echo "No edge function changes detected — skipping deploy step."
