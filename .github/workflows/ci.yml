      - name: Install Bun from npm if GitHub download fails
        if: steps.bun.outcome == 'failure'
        run: npm install --global bun@1.4.4 && bun --version

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Verify deployment checkpoint selection
        if: matrix.group == 'core'
        run: node --test scripts/tests/ultimoDeployRiuscito.test.mjs

      - name: Typecheck webhook edge functions
        if: matrix.group == 'core'
        run: npx --yes deno@2.9.6 check supabase/functions/dispatch-global-webhooks/index.ts supabase/functions/send-webhook/index.ts

      - name: Verify global webhook events, permissions and delivery queue
        if: matrix.group == 'core'
        run: bun run test:global-webhooks

      - name: Verify recovered migration guards and tenant security
        if: matrix.group == 'core'
        run: bun run test:migration-recovery

      - name: Run critical tests
