name: CI / Edge-function deploy

# ── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Avvio a mano. Serve quando il deploy non e' partito da solo: se il job
  # viene saltato — per esempio perche' il typecheck era rosso — le funzioni di
  # quel push non escono PIU', perche' il passo qui sotto diffa il range del
  # push e quei commit restano nel passato. Successo il 7 settembre 2026: 18
  # funzioni ferme fino a otto ore, fra cui la correzione sugli inviti.
  workflow_dispatch:
    inputs:
      funzioni:
        description: >-
          Quali funzioni ripubblicare, separate da spazio
          (es. "invia-sms create-reseller"). Vuoto = tutte.
        required: false
        type: string

# ── Shared env ───────────────────────────────────────────────────────────────
env:
  SUPABASE_PROJECT_ID: rsbrguhkodgnqfomrevo

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. TypeScript check (frontend)
  # ─────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      # NON "bunx tsc --noEmit": quel comando usa il tsconfig di radice, che e'
      # un contenitore vuoto (files: [] + references). Senza --build TypeScript
      # non segue i rimandi e compila ZERO file: il job era verde per
      # costruzione e ha lasciato passare 1.542 errori di tipo.
      - name: Controllo tipi (con cricchetto)
        run: bun run typecheck:ci

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Critical unit tests
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Critical tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run critical tests
        run: bun run test:critical

      - name: Run confirmed catalogue variants regression tests
        run: >-
          bunx vitest run --maxWorkers=1
          src/test/logic/variantiTecnicheConfermate.test.ts
          src/test/logic/verificaVarianti.test.ts
          src/test/logic/manodoperaEsplicita.test.ts

      - name: Run auth session regression tests
        run: >-
          bunx vitest run
          src/test/ui/authSessionRecovery.test.tsx
          src/test/logic/authStateUserRoles.test.ts
          src/test/logic/authRoleFilter.test.ts
          src/test/logic/sessionTimeout.test.ts
          src/test/logic/sessioneCondivisaSottodomini.test.ts
          src/test/logic/sessioneCookieDominio.test.ts

      - name: Run company administration regression tests
        run: |
          bunx vitest run --maxWorkers=1 --testTimeout=15000 src/test/ui/companyAdminReorganization.test.tsx src/test/ui/companyEffectiveFeatures.test.tsx src/test/ui/companyListQuickDetails.test.tsx src/test/ui/companyAIConsistency.test.tsx src/test/ui/companyWalletBalances.test.tsx src/test/ui/companyActivitySources.test.tsx src/test/ui/companyEmailQuotaDraft.test.tsx src/test/ui/adminWhiteLabel.test.tsx
          bunx vitest run --maxWorkers=2 src/test/logic/companyHealthConsistency.test.ts src/test/ui/companyLastAccessConsistency.test.tsx src/test/ui/companyKpiHealthState.test.tsx src/test/ui/companyHealthBadgeConsistency.test.tsx src/test/logic/adminRevenueHistory.test.ts src/test/logic/cockpitPortfolioRevenue.test.ts src/test/ui/adminUsersReadability.test.tsx
          node scripts/test-company-admin-cs.mjs
          node scripts/test-white-label-plan.mjs

      - name: Run superadmin operations regression tests
        run: >-
          bunx vitest run --maxWorkers=2
          src/test/logic/adminTaskState.test.ts
          src/test/logic/adminTasksPagination.test.ts
          src/test/logic/adminInsoluti.test.ts
          src/test/ui/adminInsolutiState.test.tsx
          src/test/ui/adminAttivitaNavigation.test.tsx
          src/test/ui/adminTaskCompanyLinks.test.tsx

      - name: Run superadmin email and chat regression tests
        run: >-
          bunx vitest run --maxWorkers=2
          src/test/logic/emailClientStatus.test.ts
          src/test/logic/personalEmailThread.test.ts
          src/test/ui/adminEmailScope.test.tsx
          src/test/ui/adminChatPreparation.test.tsx
          src/test/ui/chatHubNavigation.test.tsx
          src/test/ui/emailLayoutState.test.tsx

      - name: Run cash forecast regression tests
        run: >-
          TZ=Europe/Rome bunx vitest run
          src/test/logic/forecastLedger.test.ts
          src/test/logic/forecastDataset.test.ts
          src/test/ui/forecastWorkspace.test.tsx

      - name: Run independent sales area visibility regression tests
        run: >-
          bunx vitest run --maxWorkers=1
          src/test/logic/moduleVisibility.test.tsx
          src/test/logic/newQuoteDialog.test.tsx
          src/test/logic/moduleTemplateLibrary.test.tsx
          src/test/ui/modelliModuli.test.tsx
          src/test/ui/modelliAreaFotoEPermessi.test.tsx
          src/test/logic/salesSelectorTemplates.test.ts
          src/test/logic/moduliVenditaPromesse.test.ts
          src/test/ui/moduliVerita.test.tsx

      - name: Run unified credits settings regression tests
        run: >-
          bunx vitest run --maxWorkers=1
          src/test/ui/abbonamentoSchede.test.tsx
          src/test/ui/creditiRedirect.test.tsx
          src/test/logic/menuImpostazioniAggiunte.test.ts
          src/test/logic/menuERotteCoerenti.test.ts
          src/test/logic/ricercaImpostazioni.test.ts
          src/test/ui/hubTelefono.test.tsx
          src/test/ui/paletteImpostazioni.test.tsx
          src/test/ui/testataImpostazioni.test.tsx
          src/test/ui/telefoniaVerita.test.tsx
          src/test/logic/creditiSiRicaricanoSoloPagando.test.ts
          src/test/ui/creditiUnaTestataEUnaRicarica.test.tsx

      - name: Run company economics and consumption regression tests
        run: |
          bunx vitest run --maxWorkers=2 src/test/logic/companyConsumption.test.ts src/test/ui/companyConsumption.test.tsx src/test/logic/companyEconomics.test.ts src/test/ui/companyEconomics.test.tsx src/test/ui/companyAdminReorganization.test.tsx
          node scripts/test-company-economics.mjs
          node scripts/test-company-consumption.mjs

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Deploy changed edge functions (main only, after checks pass)
  # ─────────────────────────────────────────────────────────────────────────

  deploy-functions:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
        with:
          # Serve l'INTERO range del push, non solo l'ultimo commit: con
          # fetch-depth 2 un push di piu' commit deployava soltanto le funzioni
          # toccate dall'ultimo. Vedi la nota nel passo "Detect changed functions".
          fetch-depth: 0

      # Versione PINNATA: `version: latest` faceva una API call anonima a GitHub
      # per risolvere l'ultima release → rate-limit (60 req/h per IP) sui runner
      # condivisi → job rosso random ("Failed to resolve latest Supabase CLI
      # release: rate limit exceeded"). Con una versione fissa non serve nessuna
      # chiamata. Il GITHUB_TOKEN autentica eventuali download (limiti più alti).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Detect which function slugs changed.
      #
      # Le cartelle _shared / _customer_os_shared non sono funzioni, ma il loro
      # codice finisce DENTRO il pacchetto di ognuna al momento della
      # pubblicazione: se cambia una libreria e non si tocca anche un file
      # della funzione, in produzione resta la versione vecchia. Costato mezza
      # giornata il 10/09/2026 — la correzione al client IMAP stava tutta in
      # _shared/imapSmtpClient.ts: email-poll-inbox l'ha presa (aveva anche un
      # file suo modificato) ed email-send no, cosi' la posta si riceveva ma
      # non si riusciva a inviarla. Ci pensa ora
      # scripts/funzioni-da-ripubblicare.mjs, che risale la catena degli import.
      #
      # Si diffa l'INTERO range del push (github.event.before → HEAD), non
      # HEAD~1: con un push di piu' commit, HEAD~1 vede solo l'ultimo e le
      # funzioni cambiate nei commit precedenti non venivano mai deployate — in
      # silenzio, con la CI verde. Successo verificato il 31/08/2026: un push di
      # 3 commit con una modifica a process-automation nel secondo ha prodotto
      # "No functions to deploy", e il fix delle notifiche lead non e' andato in
      # produzione pur risultando pubblicato.
      #
      # Fallback su HEAD~1 quando `before` non e' utilizzabile: primo commit del
      # branch (SHA di zeri) o force-push che ha reso `before` irraggiungibile.
      - name: Detect changed functions
        id: changed
        run: |
          # Avvio a mano: si prende l'elenco chiesto, o tutte quelle che
          # esistono nel repository. Il diff del push qui non ha senso — il
          # motivo per cui si lancia a mano e' proprio che quel diff e' perso.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHIESTE="${{ inputs.funzioni }}"
            if [ -n "$CHIESTE" ]; then
              CHANGED="$CHIESTE"
              echo "Avvio manuale, funzioni chieste: ${CHANGED}"
            else
              # Solo cartelle: se un domani in supabase/functions/ finisce un
              # file sciolto (un README, un deno.json) non deve diventare una
              # funzione da deployare.
              CHANGED=$(find supabase/functions -maxdepth 1 -mindepth 1 -type d \
                | awk -F/ '{print $3}' \
                | grep -v '^_' \
                | sort -u \
                | tr '\n' ' ' \
                | xargs)
              echo "Avvio manuale, TUTTE le funzioni: $(echo "$CHANGED" | wc -w)"
            fi
            echo "functions=${CHANGED}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi
          echo "Diff range: ${BASE:-<nessuno>} → HEAD"
          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only "$BASE" HEAD -- supabase/functions/ \
              | node scripts/funzioni-da-ripubblicare.mjs)
          else
            CHANGED=""
          fi
          echo "functions=${CHANGED}" >> "$GITHUB_OUTPUT"
          if [ -n "$CHANGED" ]; then
            echo "Changed functions: ${CHANGED}"
          else
            echo "No deployable functions changed."
          fi

      # Deploy each changed function via --use-api (no Docker required in CI).
      # verify_jwt is read from supabase/config.toml automatically.
      # Non-blocking: a single function failure does not abort the rest.
      - name: Deploy changed functions
        if: steps.changed.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          FAILED=()
          for fn in ${{ steps.changed.outputs.functions }}; do
            echo "──────────────────────────────────────────"
            # Una funzione tolta dal repository si cancella anche dal progetto:
            # prima restava pubblicata e chiamabile da chiunque conoscesse
            # l'URL (25/09/2026: 43 funzioni mai usate tolte in un colpo).
            # Il repository è la fonte, come per le migrazioni. Se la
            # cancellazione non riesce (già tolta a mano) è solo un avviso.
            if [ ! -d "supabase/functions/${fn}" ]; then
              if supabase functions delete "${fn}" --project-ref "${SUPABASE_PROJECT_ID}" --yes; then
                echo "✗ ${fn} — tolta dal repository, cancellata dal progetto"
              else
                echo "::warning::${fn} tolta dal repository ma non cancellata dal progetto (forse già assente)"
              fi
              continue
            fi
            echo "→ Deploying: ${fn}"
            if supabase functions deploy "${fn}" \
                --project-ref "${SUPABASE_PROJECT_ID}" \
                --use-api; then
              echo "✓ ${fn} — deployed"
            else
              echo "✗ ${fn} — FAILED"
              FAILED+=("${fn}")
            fi
          done

          echo "══════════════════════════════════════════"
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "Deploy failures: ${FAILED[*]}"
            exit 1
          else
            echo "All functions deployed successfully."
          fi

      - name: No functions to deploy
        if: steps.changed.outputs.functions == ''
        run: echo "No edge function changes detected — skipping deploy step."
