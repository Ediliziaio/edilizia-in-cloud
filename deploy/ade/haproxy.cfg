global
    maxconn 256

defaults
    mode tcp
    timeout connect 5s
    timeout client 45s
    timeout server 45s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

# TLS terminates in Node, which verifies the actual client certificate.
# Never replace this with an HTTP reverse proxy or a forwarded-cert header.
frontend sdi
    bind :8443
    tcp-request inspect-delay 5s
    acl test_name req.ssl_sni -i sdi-test.ediliziaincloud.com
    acl production_name req.ssl_sni -i sdi.ediliziaincloud.com
    tcp-request content reject if { req.ssl_hello_type 1 } !test_name !production_name
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend test_gateway if test_name
    use_backend production_gateway if production_name
    default_backend reject_unknown

backend test_gateway
    server test test:3100 resolvers docker init-addr libc,none

backend production_gateway
    server production production:3100 resolvers docker init-addr libc,none

backend reject_unknown
    # No server: missing/unknown SNI must never reach a fiscal environment.
