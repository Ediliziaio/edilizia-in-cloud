    <!-- SW Emergency Recovery — must run before Vite module scripts are injected -->
    <script>
      // Skip SW recovery entirely on Capacitor native — there are no service workers
      if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
        /* native: no-op */
      } else
      (function () {
        function nukeAndReload(reason) {
          try {
            sessionStorage.setItem('_sw_rec_reason', reason || 'unknown');
          } catch (e) {}
          Promise.all([
            'serviceWorker' in navigator
              ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
              : Promise.resolve(),
            (typeof caches !== 'undefined' && caches.keys)
              ? caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                })
              : Promise.resolve()
          ]).then(function () {
            var url = new URL(location.href);
            url.searchParams.set('__recovery', Date.now().toString());
            url.searchParams.set('__fresh', '1');
            location.replace(url.toString());
          }).catch(function () { location.reload(); });
        }

        // Bump DEPLOY_KEY on forced SW reset (v13: 2026-05-19)
        var DEPLOY_KEY = 'sw_reset_v13';
        try {
          if (!localStorage.getItem(DEPLOY_KEY) && 'serviceWorker' in navigator) {
            localStorage.setItem(DEPLOY_KEY, '1');
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              if (regs.length > 0) nukeAndReload('new-deploy-key');
            }).catch(function () {});
          }
        } catch (e) {}

        var _recovered = sessionStorage.getItem('_sw_rec');
        function isAssetElement(target) {
          if (!target || !target.tagName) return false;
          var tag = String(target.tagName).toLowerCase();
          var src = target.src || target.href || '';
          return (tag === 'script' || tag === 'link') && /\/assets-v\d+\//.test(src);
        }
        function onError(msg, target) {
          if (_recovered) return;
          var targetUrl = target && (target.src || target.href || '');
          var isLocalDevModule =
            (location.hostname === 'localhost' || location.hostname === '127.0.0.1') &&
            /\/(@vite|src|node_modules\/\.vite)\//.test(String(targetUrl || ''));
          var isChunkError =
            msg.indexOf('Unexpected token') !== -1 ||
            msg.indexOf('<!DOCTYPE') !== -1 ||
            msg.indexOf('Failed to fetch dynamically imported') !== -1 ||
            msg.indexOf('Importing a module script failed') !== -1 ||
            msg.indexOf('Unable to preload CSS') !== -1 ||
            msg.indexOf('Loading chunk') !== -1 ||
            msg.indexOf('ChunkLoadError') !== -1 ||
            msg.indexOf('MIME type') !== -1 ||
            msg.indexOf('module script') !== -1 ||
            msg.indexOf('SECRET_INTERNALS') !== -1 ||
            msg.indexOf('before initialization') !== -1 ||
            isLocalDevModule ||
            isAssetElement(target);
          if (isChunkError) {
            _recovered = '1';
            sessionStorage.setItem('_sw_rec', '1');
            nukeAndReload('asset-load-error');
          }
        }
        window.addEventListener('error', function (e) {
          onError((e && e.message) || '', e && e.target);
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          onError((e && e.reason && e.reason.message) || String((e && e.reason) || ''), null);
        }, true);

        function isAppHost() {
          return /^app\./i.test(location.hostname) ||
            location.hostname === 'localhost' ||
            location.hostname === '127.0.0.1';
        }

        function isPrivateAppPath() {
          return /^\/(login|azienda|admin|cliente|campo|tecnico|dipendente|venditore|partner|cambia-password|reset-password)(\/|$)/.test(location.pathname);
        }

        function bodyLooksLikeMarketingHome() {
          var text = (document.body && document.body.innerText) || '';
          return text.indexOf('Richiedi una demo') !== -1 &&
            text.indexOf('Aumenta margini, utili e guadagni') !== -1 &&
            text.indexOf('Vedi tutti i moduli') !== -1;
        }

        function assertAppPathNotMarketing() {
          if (_recovered) return;
          if (!isAppHost() || !isPrivateAppPath()) return;
          if (!bodyLooksLikeMarketingHome()) return;
          _recovered = '1';
          sessionStorage.setItem('_sw_rec', '1');
          nukeAndReload('app-host-marketing-cache');
        }

        // v13 — Check più aggressivo + precoce. Riducendo l'intervallo del
        // secondo check da 1500ms a 400ms eliminiamo i ~1.1s di flash visibile
        // della Home page sui device con SW stale. Aggiungiamo anche un check
        // a 50ms perché su Vite il body è popolato quasi subito.
        if (document.readyState === 'loading') {
          window.addEventListener('DOMContentLoaded', function () {
            setTimeout(assertAppPathNotMarketing, 0);
            setTimeout(assertAppPathNotMarketing, 50);
            setTimeout(assertAppPathNotMarketing, 400);
          }, { once: true });
        } else {
          setTimeout(assertAppPathNotMarketing, 0);
          setTimeout(assertAppPathNotMarketing, 50);
          setTimeout(assertAppPathNotMarketing, 400);
        }
      })();
    </script>

          var canonicalUrl = base + (path === '/' ? '/' : path);
          var head = document.head || document.getElementsByTagName('head')[0];
          if (!head) return;
          // Insert canonical link
          var lc = document.createElement('link');
          lc.rel = 'canonical';
          lc.setAttribute('data-dynamic', '1');

    <!-- Hero preload — due varianti media-scoped ALLINEATE al <picture> di
         HeroSection: telefoni (≤640px) max 768w (~55KB, prima un display 3x
         precaricava la 1440w da 152KB ed era l'LCP element), desktop lista
         completa. Se questi srcset divergono dal <picture> si torna al
         doppio download: tenerli sincronizzati.

         SOLO SULLA HOME. Questo file è anche lo shell SPA servito a /login,
         /azienda/*, /admin/* e a ogni rotta non prerenderizzata: lì l'hero non
         esiste e i 55KB ad alta priorità rubavano banda ai JS/CSS critici.
         Erano due <link> statici; ora li inserisce questo script inline, che
         gira prima del <body> (quindi il preload parte comunque presto) e si
         auto-disattiva fuori da "/". Nelle pagine prerenderizzate lo snapshot
         di Playwright conserva il comportamento giusto: i <link> finiscono
         nell'HTML della sola home. -->
    <script>
      (function () {
        var p = location.pathname;
        if (p !== "/" && p !== "/index.html" && p !== "/_home/index.html") return;
        var hero = [
          ["(max-width: 640px)", "/hero/cantiere-768.webp",
           "/hero/cantiere-480.webp 480w,/hero/cantiere-768.webp 768w"],
          ["(min-width: 641px)", "/hero/cantiere-1024.webp",
           "/hero/cantiere-480.webp 480w,/hero/cantiere-768.webp 768w,/hero/cantiere-1024.webp 1024w,/hero/cantiere-1440.webp 1440w,/hero/cantiere-1920.webp 1920w"]
        ];
        for (var i = 0; i < hero.length; i++) {
          var l = document.createElement("link");
          l.rel = "preload";
          l.as = "image";
          l.setAttribute("fetchpriority", "high");
          l.media = hero[i][0];
          l.href = hero[i][1];
          l.setAttribute("imagesrcset", hero[i][2]);
          l.setAttribute("imagesizes", "100vw");
          document.head.appendChild(l);
        }
      })();
    </script>

        function hasSupabaseToken() {
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (key && key.indexOf('sb-') === 0 && key.indexOf('auth-token') !== -1) {
                var value = localStorage.getItem(key);
                if (value && value.length > 50) return true;
              }
            }
          } catch (e) {}
          return false;
        }

        function cachedRole() {
          try {
            var raw = sessionStorage.getItem('auth_profile_v1');
            if (!raw) return null;
            var parsed = JSON.parse(raw);
            return parsed && parsed.role ? String(parsed.role) : null;
          } catch (e) {
            return null;
          }
        }

        var hasHint = hasSupabaseToken();
        try {
          hasHint = hasHint || !!sessionStorage.getItem('auth_profile_v1') || !!sessionStorage.getItem('user_session_id');
        } catch (e) {}
        if (!hasHint) return;

        var role = cachedRole();
        var target = '/azienda';
        if (role && role.indexOf('platform_') === 0) target = '/admin';
        if (role === 'super_admin') target = '/admin';
        if (role === 'customer') target = '/cliente';
        if (role === 'employee' || role === 'subcontractor') target = '/campo';
        if (role === 'salesperson') target = '/venditore';

        location.replace(target + location.search + location.hash);

                '<div style="width:44px;height:44px;border-radius:999px;background:#fff7ed;color:#ea580c;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-weight:800">!</div>',
                '<p style="margin:0;font-size:18px;font-weight:700">Caricamento bloccato</p>',
                '<p style="margin:10px 0 0;font-size:14px;line-height:1.5;color:#6b7280">La pagina non ha completato il bootstrap. Riprova senza restare fermo sulla rotellina.</p>',
                '<p style="margin:12px 0 0;font-size:11px;line-height:1.4;color:#9ca3af">Dettaglio: ' + String(reason || 'bootstrap-timeout').replace(/[<>&"]/g, '') + '</p>',
                '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px">',
                  '<button id="eic-boot-retry" style="height:40px;border:0;border-radius:8px;background:#f97316;color:#fff;font-weight:700;padding:0 16px;cursor:pointer">Riprova</button>',
                  '<button id="eic-boot-reset" style="height:40px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;color:#111;font-weight:700;padding:0 16px;cursor:pointer">Reset cache</button>',
                '</div>',
              '</div>',
            '</div>'
          ].join('');

          var retry = document.getElementById('eic-boot-retry');
          var reset = document.getElementById('eic-boot-reset');
          if (retry) {
            retry.onclick = function () {
              clearRecoveryMarkers();
              location.reload();
            };
          }
          if (reset) {
            reset.onclick = function () {
              clearRecoveryMarkers();
              clearBrowserAppState().finally(function () {
                var url = new URL(location.href);
                url.searchParams.set('__recovery', Date.now().toString());
                location.replace(url.toString());
              });
            };
          }
        }

        window.__EIC_BOOT_OK__ = function () {
          try {
            var bootGuard = document.getElementById('eic-boot-guard');
            if (bootGuard) bootGuard.remove();
          } catch (e) {}
          // Boot riuscito → azzera l'escalation di recovery: il prossimo load
          // lento nella stessa tab riparte dall'auto-recovery, non dal fallback.
          clearRecoveryMarkers();
        };

        function recoverBootstrap(reason) {
          try {
            if (sessionStorage.getItem(BOOT_RECOVERY_KEY)) {
              showBootstrapFallback(reason || 'bootstrap-timeout-after-recovery');
              return;
            }
            sessionStorage.setItem(BOOT_RECOVERY_KEY, reason || 'bootstrap-timeout');
          } catch (e) {}

          clearBrowserAppState().finally(function () {
            var url = new URL(location.href);
            if (PRIVATE_HOST_RE.test(location.hostname) && location.pathname === '/') {
              url.pathname = '/login';
              url.search = '';
            }
            url.searchParams.set('__recovery', Date.now().toString());
            location.replace(url.toString());
          });
        }

        function recoverBlankScreen() {
          if (!LOCAL_DEV_HOST_RE.test(location.hostname)) return;
          if (!PRIVATE_PATH_RE.test(location.pathname)) return;

          var root = document.getElementById('root');
          var bootGuard = document.getElementById('eic-boot-guard');
          var bodyText = ((document.body && document.body.innerText) || '').trim();
          var rootText = ((root && root.innerText) || '').trim();
          var guardVisible = !!bootGuard;
          if (bodyText.length > 12 && rootText.length > 12 && !guardVisible) return;

          try {
            if (sessionStorage.getItem(BLANK_RECOVERY_KEY)) {
              showBootstrapFallback('local-dev-blank-screen');
              return;
            }
            sessionStorage.setItem(BLANK_RECOVERY_KEY, '1');
          } catch (e) {}

          clearBrowserAppState().finally(function () {
            var url = new URL(location.href);
            url.searchParams.set('__recovery', Date.now().toString());
            location.replace(url.toString());
          });
        }

        // v13 — Timeout ridotto da 15s a 10s: dopo questo tempo se React
        // non ha ancora montato (spinner inline visibile) lo stack è
        // probabilmente bloccato da SW/cache stale → recovery utile prima
        // di vedere "1 minuto" percepito.
        // In localhost Vite può compilare a freddo, ma 30s lasciavano l'utente
        // davanti alla rotellina troppo a lungo. Mostriamo un fallback azionabile
        // prima, senza reload automatici ripetuti.
        var BOOT_TIMEOUT_MS = IS_LOCAL_DEV ? 20000 : 10000;
        armProgressAwareWatchdog(function () {
          var root = document.getElementById('root');
          if (!root) return;
          var text = root.textContent || '';
          var stillInitialBootstrap = text.indexOf('Caricamento Edilizia in Cloud') !== -1;
          var privateRootStillSpinner =
            PRIVATE_HOST_RE.test(location.hostname) &&
            location.pathname === '/' &&
            !root.querySelector('input, button, a[href*="login"]');

          if (stillInitialBootstrap || privateRootStillSpinner) {
            if (IS_LOCAL_DEV && stillInitialBootstrap) {
              showBootstrapFallback('local-dev-bootstrap-timeout');
              return;
            }
            recoverBootstrap(stillInitialBootstrap ? 'initial-bootstrap-timeout' : 'private-root-spinner-timeout');
          }
        }, BOOT_TIMEOUT_MS);

        // In locale Vite puo restare "bianco" mentre compila chunk grossi o
        // mentre HMR riallinea i provider. Il watchdog progress-aware si riarma
        // finché arrivano moduli, quindi la soglia base può restare contenuta.
        armProgressAwareWatchdog(recoverBlankScreen, IS_LOCAL_DEV ? 22_000 : 12_000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
