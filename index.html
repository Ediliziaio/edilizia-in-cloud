    <!-- SW Emergency Recovery — must run before Vite module scripts are injected -->
    <script>
      // Skip SW recovery entirely on Capacitor native — there are no service workers
      if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
        /* native: no-op */
      } else
      (function () {
        function nukeAndReload(reason) {
          try {
            sessionStorage.setItem('_sw_rec_reason', reason || 'unknown');
          } catch (e) {}
          Promise.all([
            'serviceWorker' in navigator
              ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
              : Promise.resolve(),
            (typeof caches !== 'undefined' && caches.keys)
              ? caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                })
              : Promise.resolve()
          ]).then(function () {
            var url = new URL(location.href);
            url.searchParams.set('__recovery', Date.now().toString());
            url.searchParams.set('__fresh', '1');
            location.replace(url.toString());
          }).catch(function () { location.reload(); });
        }

        // Increment DEPLOY_KEY whenever a forced SW reset is needed.
        // v13 (2026-05-19): utenti continuano a vedere flash della home page
        // su app.*/admin/* al refresh, seguito da "1 minuto" di caricamento.
        // Diagnosi: il SW vecchio (pre-selfDestroying) intercetta navigation
        // e serve HTML stale con Home renderizzata → assertAppPathNotMarketing
        // rileva dopo 1.5s → nukeAndReload → recovery 15s + bundle fresh.
        // Bump v13 forza l'unregister immediato sui device residui che non
        // hanno ancora completato il ciclo selfDestroying.
        // v12 (2026-05-15): alcuni browser restavano controllati da un vecchio
        // SW/cache marketing su app.ediliziaincloud.com/login?__recovery=...
        // mostrando la landing al posto del login. Bump + controllo DOM sotto
        // forzano pulizia e reload cache-busting anche se il chunk recovery
        // viene attivato dopo un deploy.
        // v11 (2026-05-13): forza la pulizia dopo il fix del loop login causato
        // da token Supabase stale in localStorage + vecchi asset/SW cached.
        // v10 (2026-05-09): forza la pulizia dei device/localhost che avevano
        // già applicato v9 ma tenevano ancora asset SPA vecchi in cache.
        // v9 (2026-04-26): SW non deve più intercettare /auth/v1/* né
        // /functions/v1/* — quel pattern aveva bloccato il login mobile su
        // iOS Safari ("Accesso in corso..." infinito). Bump forza l'unregister
        // del vecchio SW sui device che hanno ancora la versione bacata.
        var DEPLOY_KEY = 'sw_reset_v13';
        try {
          if (!localStorage.getItem(DEPLOY_KEY) && 'serviceWorker' in navigator) {
            localStorage.setItem(DEPLOY_KEY, '1');
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              if (regs.length > 0) nukeAndReload('new-deploy-key');
            }).catch(function () {});
          }
        } catch (e) {}

        var _recovered = sessionStorage.getItem('_sw_rec');
        function isAssetElement(target) {
          if (!target || !target.tagName) return false;
          var tag = String(target.tagName).toLowerCase();
          var src = target.src || target.href || '';
          return (tag === 'script' || tag === 'link') && /\/assets-v\d+\//.test(src);
        }
        function onError(msg, target) {
          if (_recovered) return;
          var isChunkError =
            msg.indexOf('Unexpected token') !== -1 ||
            msg.indexOf('<!DOCTYPE') !== -1 ||
            msg.indexOf('Failed to fetch dynamically imported') !== -1 ||
            msg.indexOf('Importing a module script failed') !== -1 ||
            msg.indexOf('Unable to preload CSS') !== -1 ||
            msg.indexOf('Loading chunk') !== -1 ||
            msg.indexOf('ChunkLoadError') !== -1 ||
            msg.indexOf('MIME type') !== -1 ||
            msg.indexOf('module script') !== -1 ||
            msg.indexOf('SECRET_INTERNALS') !== -1 ||
            msg.indexOf('before initialization') !== -1 ||
            isAssetElement(target);
          if (isChunkError) {
            _recovered = '1';
            sessionStorage.setItem('_sw_rec', '1');
            nukeAndReload('asset-load-error');
          }
        }
        window.addEventListener('error', function (e) {
          onError((e && e.message) || '', e && e.target);
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          onError((e && e.reason && e.reason.message) || String((e && e.reason) || ''), null);
        }, true);

        function isAppHost() {
          return /^app\./i.test(location.hostname) ||
            location.hostname === 'localhost' ||
            location.hostname === '127.0.0.1';
        }

        function isPrivateAppPath() {
          return /^\/(login|azienda|admin|cliente|campo|tecnico|dipendente|venditore|partner|cambia-password|reset-password)(\/|$)/.test(location.pathname);
        }

        function bodyLooksLikeMarketingHome() {
          var text = (document.body && document.body.innerText) || '';
          return text.indexOf('Richiedi una demo') !== -1 &&
            text.indexOf('Aumenta margini, utili e guadagni') !== -1 &&
            text.indexOf('Vedi tutti i moduli') !== -1;
        }

        function assertAppPathNotMarketing() {
          if (_recovered) return;
          if (!isAppHost() || !isPrivateAppPath()) return;
          if (!bodyLooksLikeMarketingHome()) return;
          _recovered = '1';
          sessionStorage.setItem('_sw_rec', '1');
          nukeAndReload('app-host-marketing-cache');
        }

        // v13 — Check più aggressivo + precoce. Riducendo l'intervallo del
        // secondo check da 1500ms a 400ms eliminiamo i ~1.1s di flash visibile
        // della Home page sui device con SW stale. Aggiungiamo anche un check
        // a 50ms perché su Vite il body è popolato quasi subito.
        if (document.readyState === 'loading') {
          window.addEventListener('DOMContentLoaded', function () {
            setTimeout(assertAppPathNotMarketing, 0);
            setTimeout(assertAppPathNotMarketing, 50);
            setTimeout(assertAppPathNotMarketing, 400);
          }, { once: true });
        } else {
          setTimeout(assertAppPathNotMarketing, 0);
          setTimeout(assertAppPathNotMarketing, 50);
          setTimeout(assertAppPathNotMarketing, 400);
        }
      })();
    </script>

    <!-- Canonical + Hreflang ────────────────────────────────────────────────
         v8.6.47 — SEO fix critico per Google Search Console:
         Prima il canonical statico nell'HTML era sempre "/" (homepage), e uno
         script JS lo sovrascriveva DOPO. Googlebot leggeva spesso il canonical
         iniziale "/" durante la prima passata → segnale "tutte le pagine
         puntano alla homepage" → de-indicizzazione massiva.
         Cause GSC risolte:
         - "Pagina alternativa con tag canonical appropriato" (calendario-lavori)
         - "Pagina duplicata, Google ha scelto canonica diversa" (6 pagine)
         - "Pagina scansionata ma non indicizzata" (5 pagine incl. homepage)
         Fix: lo script INLINE all'inizio dell'head inserisce subito il
         canonical corretto via createElement+appendChild PRIMA che il fallback
         statico venga aggiunto al DOM. Per i crawler no-JS resta il fallback
         <link> statico (path canonico homepage). -->
    <script>
      (function() {
        try {
          var base = 'https://www.ediliziaincloud.com';
          var path = window.location.pathname || '/';
          var isFile = /\.[a-z0-9]{2,8}$/i.test(path);
          if (path !== '/' && !isFile && !path.endsWith('/')) path += '/';
          var canonicalUrl = base + (path === '/' ? '/' : path);
          var head = document.head || document.getElementsByTagName('head')[0];
          if (!head) return;
          // Insert canonical link
          var lc = document.createElement('link');
          lc.rel = 'canonical';
          lc.setAttribute('data-dynamic', '1');
          lc.href = canonicalUrl;
          head.appendChild(lc);
          // hreflang it + x-default
          var lit = document.createElement('link');
          lit.rel = 'alternate';
          lit.hreflang = 'it-IT';
          lit.setAttribute('data-dynamic', '1');
          lit.href = canonicalUrl;
          head.appendChild(lit);
          var lx = document.createElement('link');
          lx.rel = 'alternate';
          lx.hreflang = 'x-default';
          lx.setAttribute('data-dynamic', '1');
          lx.href = canonicalUrl;
          head.appendChild(lx);
          // og:url
          var om = document.createElement('meta');
          om.setAttribute('property', 'og:url');
          om.setAttribute('data-dynamic', '1');
          om.setAttribute('content', canonicalUrl);
          head.appendChild(om);
        } catch (e) { /* no-op: fallback statico sotto */ }
      })();
    </script>
    <!-- NESSUN fallback statico di canonical/hreflang/og:url.
         Motivo: la SPA `dist/index.html` è il fallback per OGNI rotta non
         prerenderata. Un canonical statico "https://www.ediliziaincloud.com/"
         si applicherebbe ERRATAMENTE anche a /pianifica-migrazione/, /dpa/,
         /blog/<slug>/, ecc. — causa diretta delle segnalazioni GSC
         "Pagina duplicata, Google ha scelto canonica diversa" e
         "Pagina alternativa con tag canonical appropriato".
         Strategia attuale:
         - Bot noti (Googlebot, Bingbot, Claude, GPT, ...) ricevono SSR HTML
           dal middleware Cloudflare con canonical corretto per rotta.
         - Browser (utenti reali) eseguono lo script inline sopra che imposta
           il canonical dinamico sincrono prima del primo render React.
         - Crawler no-JS sconosciuti: nessun canonical → Google deduce dalla
           sitemap (preferibile a un canonical sbagliato).
    -->
    <!-- Preconnect per risorse critiche -->

    <link rel="dns-prefetch" href="https://rsbrguhkodgnqfomrevo.supabase.co">

    <!-- Inter font (Google Fonts) — caricato PRIMA del CSS bundle.
         Prima era @import dentro src/index.css → richiesta serializzata di
         750ms render-blocking (rilevato da PageSpeed mobile). Spostandolo qui
         con preconnect + stylesheet asincrono (onload pattern), il font può
         scaricare in parallelo agli script senza bloccare il First Contentful Paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">

    <!--
      Velocity — Preload hero Unsplash CONDIZIONALE.
      L'immagine è LCP SOLO sulla landing pubblica e route marketing (city/per/blog).
      Se l'utente è su /azienda, /admin, /portale-* non la vedrà mai: preloadarla
      sarebbe uno spreco di 200+ KB di banda mobile in cantiere.
      Iniettiamo preconnect+preload inline prima che il parser chieda chunks JS,
      così non perdiamo l'head-start sul LCP dove conta davvero.
    -->
    <script>
      (function () {
        var path = window.location.pathname || '/';
        var APP_PREFIXES = /^\/(azienda|admin|cliente|dipendente|venditore|partner|salesperson|customer|employee|tecnico|campo|portale|portale-cliente|login|auth-callback|reset-password)(\/|$)/;
        if (APP_PREFIXES.test(path)) return; // no-op su route applicative
        var head = document.head;
        function add(rel, href, extra) {
          var l = document.createElement('link');
          l.rel = rel;
          l.href = href;
          if (extra) Object.keys(extra).forEach(function (k) { l.setAttribute(k, extra[k]); });
          head.appendChild(l);
        }
        add('preconnect', 'https://images.unsplash.com');
        add('dns-prefetch', 'https://images.unsplash.com');
        // Preload responsive: mobile (≤640) → 640w WebP ~30KB; desktop → 1280w ~120KB.
        // imagesrcset/imagesizes accordano il preload con il <img srcset> in HeroSection.
        var preloadLink = document.createElement('link');
        preloadLink.rel = 'preload';
        preloadLink.as = 'image';
        preloadLink.setAttribute('fetchpriority', 'high');
        preloadLink.href = 'https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fm=webp&fit=crop&w=1024&q=50';
        preloadLink.setAttribute('imagesrcset',
          'https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fm=webp&fit=crop&w=480&q=40 480w,' +
          'https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fm=webp&fit=crop&w=768&q=45 768w,' +
          'https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fm=webp&fit=crop&w=1024&q=50 1024w,' +
          'https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fm=webp&fit=crop&w=1440&q=55 1440w,' +
          'https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fm=webp&fit=crop&w=1920&q=60 1920w'
        );
        preloadLink.setAttribute('imagesizes', '100vw');
        head.appendChild(preloadLink);
      })();
    </script>

    <script>

        var isPublicMarketingPage = !!MARKETING_HOSTS[window.location.hostname] && !PRIVATE_PREFIXES.test(window.location.pathname || '/');

        window.__EIC_GA_ENABLED = isPublicMarketingPage;
        if (!isPublicMarketingPage) return;

        window.gtag = function(){window.dataLayer.push(arguments);};

        //   - prima interazione utente (scroll/click/keydown)
        //   - requestIdleCallback (browser fermo)
        // così il LCP/FCP non perde tempo CPU per GA.
        var gaLoaded = false;
        function loadGA() {
          if (gaLoaded) return;
          gaLoaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(s);
        }
        var EVENTS = ['scroll', 'click', 'keydown', 'touchstart', 'mousemove'];
        function onInteract() {
          EVENTS.forEach(function(e){ window.removeEventListener(e, onInteract, { passive: true, capture: true }); });
          loadGA();
        }
        EVENTS.forEach(function(e){ window.addEventListener(e, onInteract, { passive: true, capture: true }); });
        setTimeout(loadGA, 3500);
      })();
    </script>
  </head>

  <body>
    <script>
      (function () {
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!isLocal || location.pathname !== '/') return;

        function hasSupabaseToken() {
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (key && key.indexOf('sb-') === 0 && key.indexOf('auth-token') !== -1) {
                var value = localStorage.getItem(key);
                if (value && value.length > 50) return true;
              }
            }
          } catch (e) {}
          return false;
        }

        function cachedRole() {
          try {
            var raw = sessionStorage.getItem('auth_profile_v1');
            if (!raw) return null;
            var parsed = JSON.parse(raw);
            return parsed && parsed.role ? String(parsed.role) : null;
          } catch (e) {
            return null;
          }
        }

        var hasHint = hasSupabaseToken();
        try {
          hasHint = hasHint || !!sessionStorage.getItem('auth_profile_v1') || !!sessionStorage.getItem('user_session_id');
        } catch (e) {}
        if (!hasHint) return;

        var role = cachedRole();
        var target = '/azienda';
        if (role && role.indexOf('platform_') === 0) target = '/admin';
        if (role === 'super_admin') target = '/admin';
        if (role === 'customer') target = '/cliente';
        if (role === 'employee' || role === 'subcontractor') target = '/campo';
        if (role === 'salesperson') target = '/venditore';
        if (role === 'referrer') target = '/partner';
        location.replace(target + location.search + location.hash);
      })();
    </script>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#111;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px;text-align:center">
        <div>
          <div style="width:28px;height:28px;border:3px solid #e5e7eb;border-top-color:#f97316;border-radius:999px;margin:0 auto 16px;animation:eic-spin .8s linear infinite"></div>
          <p style="margin:0;font-size:14px;font-weight:600">Caricamento Edilizia in Cloud...</p>
          <p style="margin:8px 0 0;font-size:12px;color:#6b7280">Se la pagina resta ferma, aggiorna.</p>
        </div>
      </div>
    </div>
    <style>@keyframes eic-spin{to{transform:rotate(360deg)}}</style>
    <script>
      (function () {
        if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
          return;
        }

        var BOOT_RECOVERY_KEY = 'eic_boot_recovery_v1';
        var PRIVATE_HOST_RE = /^(app|admin|clienti|lavori)\./;

        function clearBrowserAppState() {
          return Promise.all([
            'serviceWorker' in navigator
              ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
              : Promise.resolve(),
            (typeof caches !== 'undefined' && caches.keys)
              ? caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                })
              : Promise.resolve()
          ]);
        }

        function recoverBootstrap(reason) {
          try {
            if (sessionStorage.getItem(BOOT_RECOVERY_KEY)) return;
            sessionStorage.setItem(BOOT_RECOVERY_KEY, reason || 'bootstrap-timeout');
          } catch (e) {}

          clearBrowserAppState().finally(function () {
            var url = new URL(location.href);
            if (PRIVATE_HOST_RE.test(location.hostname) && location.pathname === '/') {
              url.pathname = '/login';
              url.search = '';
            }
            url.searchParams.set('__recovery', Date.now().toString());
            location.replace(url.toString());
          });
        }

        // v13 — Timeout ridotto da 15s a 10s: dopo questo tempo se React
        // non ha ancora montato (spinner inline visibile) lo stack è
        // probabilmente bloccato da SW/cache stale → recovery utile prima
        // di vedere "1 minuto" percepito.
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (!root) return;
          var text = root.textContent || '';
          var stillInitialBootstrap = text.indexOf('Caricamento Edilizia in Cloud') !== -1;
          var privateRootStillSpinner =
            PRIVATE_HOST_RE.test(location.hostname) &&
            location.pathname === '/' &&
            !root.querySelector('input, button, a[href*="login"]');

          if (stillInitialBootstrap || privateRootStillSpinner) {
            recoverBootstrap(stillInitialBootstrap ? 'initial-bootstrap-timeout' : 'private-root-spinner-timeout');
          }
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
